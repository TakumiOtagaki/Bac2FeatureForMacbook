# macOS conda environment for Bac2Feature.
# Apple silicon users should create this env with CONDA_SUBDIR=osx-64 to pull x86_64 builds:
#   export CONDA_SUBDIR=osx-64
#   conda env create --name bac2feature --file environment/env_bac2feature_macos.yml
#   unset CONDA_SUBDIR
name: bac2feature
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.8
  - pandas>=1.3,<2
  - numpy>=1.21,<2
  - scipy>=1.10,<1.11
  - scikit-learn>=1.1,<1.4
  - biopython>=1.80
  - picrust2=2.5.2
  - hmmer>=3.1
  - blast>=2.13
  - seqkit>=2.3
  - epa-ng>=0.3
  - gappa>=0.8
  - mafft>=7.515
  - fasttree>=2.1
  - pplacer=1.1.alpha19
  - taxtastic>=0.9
  - r-base=4.2
  - r-ape>=5.7
  - r-castor>=1.8
  - r-optparse>=1.7
  - pip
